  #   needs: [test]
  #   if: github.event_name == 'push'
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v4
  #     - name: Setup Python
  #       uses: actions/setup-python@v5
  #       with:
  #         python-version: "3.11"
  #     - name: Install model deps
  #       run: pip install -r services/model/requirements.txt mlflow
  #     - name: Evaluate model
  #       run: python scripts/evaluate_model.py --release-tag ${{ github.ref_name }}
  #     - name: Upload artifact
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: mlruns-${{ github.ref_name }}
  #         path: mlruns/

  build-and-push:
    needs: [test] # ajouter le evaluate-model
    # DÉMO CI ROUGE — condition élargie temporairement pour tester l'échec
    # de build sur une PR (normalement : if: github.event_name == 'push').
    # À revert avant de merger quoi que ce soit, branche jetable.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [model, backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.service }} image
        run: |
          IMG="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')-${{ matrix.service }}"
          TAG="${GITHUB_REF_NAME//\//-}"
          docker build -t "$IMG:$TAG" ./services/${{ matrix.service }}
          docker push "$IMG:$TAG"
